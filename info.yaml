# Tiny Tapeout project information
project:
  title:        "Active Inference Agent"
  author:       "Aarav"
  discord:      ""
  description:  "A minimal active inference agent: Bayesian belief update plus expected-free-energy planning over a 3-state POMDP, in 8-bit log-domain fixed point."
  language:     "Verilog"      # generated from Amaranth HDL
  clock_hz:     25000000

  # How many tiles your design occupies. 1x1 is the smallest.
  tiles:        "1x1"

  # The top module name MUST start with "tt_um_" and be unique.
  top_module:   "tt_um_active_inference"

  # Source files, relative to the src/ folder.
  source_files:
    - "project.v"
    - "active_inference_core.v"

# The pinout. Describe what each used pin does.
pinout:
  # Inputs
  ui[0]: "observation bit 0"
  ui[1]: "observation bit 1"
  ui[2]: "tick (pulse high one cycle to run an inference step)"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "action bit 0"
  uo[1]: "action bit 1 (action: 0=move LEFT, 1=stay, 2=move RIGHT)"
  uo[2]: "ready (decision valid)"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins (all used as outputs here: belief debug byte)
  uio[0]: "belief[LEFT] debug bit 0"
  uio[1]: "belief[LEFT] debug bit 1"
  uio[2]: "belief[LEFT] debug bit 2"
  uio[3]: "belief[LEFT] debug bit 3"
  uio[4]: "belief[LEFT] debug bit 4"
  uio[5]: "belief[LEFT] debug bit 5"
  uio[6]: "belief[LEFT] debug bit 6"
  uio[7]: "belief[LEFT] debug bit 7"

# Do not change!
yaml_version: 6
